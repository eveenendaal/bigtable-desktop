<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Bigtable Desktop app icon: a table grid where one cell opens into its version timeline.
       Source for build/icon.png and build/icon.icns (regenerate with `make icons`). -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE3EC"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="squircle" d="M512 100c-238 0-305 0-358 53S100 274 100 512s0 305 53 358 120 54 359 54 305 0 358-54 54-120 54-358 0-305-54-358S750 100 512 100z"/>
    <rect id="head" width="136" height="136" rx="22" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="6"/>
    <rect id="cell" width="136" height="136" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="6"/>
  </defs>

  <!-- Background -->
  <use xlink:href="#squircle" fill="url(#bg)" filter="url(#shadow)"/>
  <use xlink:href="#squircle" fill="url(#gloss)" opacity="0.5"/>

  <!-- Table: header row and three data rows -->
  <use xlink:href="#head" x="200" y="230"/>
  <use xlink:href="#head" x="350" y="230"/>
  <use xlink:href="#head" x="500" y="230"/>
  <use xlink:href="#cell" x="200" y="380"/>
  <use xlink:href="#cell" x="350" y="380"/>
  <use xlink:href="#cell" x="500" y="380"/>
  <use xlink:href="#cell" x="200" y="530"/>
  <use xlink:href="#cell" x="500" y="530"/>
  <use xlink:href="#cell" x="200" y="680"/>
  <use xlink:href="#cell" x="350" y="680"/>
  <use xlink:href="#cell" x="500" y="680"/>
  <!-- Selected cell -->
  <rect x="350" y="530" width="136" height="136" rx="22" fill="#2563EB"/>

  <!-- Version timeline panel -->
  <rect x="600" y="330" width="260" height="400" rx="40" fill="#1E3A8A" filter="url(#soft)"/>
  <line x1="670" y1="410" x2="670" y2="650" stroke="#93C5FD" stroke-width="12" stroke-linecap="round"/>
  <circle cx="670" cy="410" r="30" fill="#FBBF24"/>
  <circle cx="670" cy="530" r="24" fill="#93C5FD"/>
  <circle cx="670" cy="650" r="24" fill="#93C5FD"/>
  <rect x="720" y="392" width="100" height="36" rx="18" fill="#fff"/>
  <rect x="720" y="514" width="80" height="32" rx="16" fill="#BFDBFE"/>
  <rect x="720" y="634" width="90" height="32" rx="16" fill="#BFDBFE"/>

  <!-- Connector from the selected cell to its timeline -->
  <path d="M486 590 L600 530" stroke="#2563EB" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
</svg>
