name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Start Bigtable emulator
        run: |
          go install cloud.google.com/go/bigtable/cmd/emulator@latest
          "$(go env GOPATH)/bin/emulator" -host localhost -port 8086 &
          for i in $(seq 1 30); do nc -z localhost 8086 && break; sleep 1; done
      - name: Test
        run: npm test
        env:
          BIGTABLE_EMULATOR_HOST: localhost:8086
      - name: Check cask syntax
        run: ruby -c Casks/bigtable-desktop.rb
