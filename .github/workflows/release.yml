name: Release

# Push a tag like v0.2.0 to build installers, publish a GitHub release and
# update the Homebrew cask in Casks/bigtable-desktop.rb.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac --arm64 --x64
          - os: ubuntu-latest
            target: --linux --x64
          - os: windows-latest
            target: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  update-cask:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: dist-macos-14
          path: dist
      - name: Update cask version and checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/update-cask.js "$VERSION" \
            "dist/bigtable-desktop-$VERSION-arm64.dmg" \
            "dist/bigtable-desktop-$VERSION-x64.dmg"
      - name: Commit cask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/bigtable-desktop.rb
          git commit -m "Update Homebrew cask to ${GITHUB_REF_NAME}" || exit 0
          git push
